name: Market Briefs

on:
  # Triggered manually or by an external cron service through the GitHub workflow_dispatch API.
  workflow_dispatch:

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      NODE_BIN: node
      NODE_MODULES: ${{ github.workspace }}/node_modules
      CHROME_PATH: auto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Feishu secrets
        run: |
          test -n "$FEISHU_WEBHOOK" || (echo "::error::FEISHU_WEBHOOK repository secret is missing"; exit 1)
          test -n "$FEISHU_APP_ID" || (echo "::error::FEISHU_APP_ID repository secret is missing"; exit 1)
          test -n "$FEISHU_APP_SECRET" || (echo "::error::FEISHU_APP_SECRET repository secret is missing"; exit 1)
          echo "Feishu secrets are present."

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate and push Nasdaq image
        run: |
          python -B -m nasdaq_morning_brief --config config.example.yaml --require-push

      - name: Generate and push A-share image
        run: |
          python -B -m nasdaq_morning_brief.ashare_report --config config.example.yaml --require-push

      - name: Upload generated card artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-briefs
          path: |
            output/brief.html
            output/brief.png
            output/ashare.html
            output/ashare.png
            output/*.log
            ashare_theme_heat_history.csv
            ashare_theme_etf.csv
            ashare_observation_state.json
            ashare_lowfreq_cache.json
            ashare_prediction_log.csv
            ashare_model_state.json
          if-no-files-found: ignore
