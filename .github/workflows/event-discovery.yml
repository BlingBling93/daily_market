name: Event Discovery

on:
  # Triggered manually or by an external cron service through the GitHub workflow_dispatch API.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-event-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh discovered event cache
        run: |
          python -B -m nasdaq_morning_brief.discovery --config config.example.yaml

      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-discovery-cache
          path: policy_discovered_events_cache.json
          if-no-files-found: ignore

      - name: Commit discovery cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy_discovered_events_cache.json
          git diff --cached --quiet || git commit -m "Refresh discovered event cache"
          git push
