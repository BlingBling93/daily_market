name: Event Discovery

on:
  # Daily GitHub-native backstop. 23:30 UTC is 07:30 Asia/Shanghai the next day.
  # Keep workflow_dispatch as well: the external trigger can still request an
  # immediate refresh, but a failed external cron must not leave the cache stale.
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

concurrency:
  group: event-discovery-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-event-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh discovered event cache
        run: |
          python -B -m nasdaq_morning_brief.discovery --config config.example.yaml

      - name: Refresh calendar event result cache
        run: |
          python -B -m nasdaq_morning_brief.event_results --config config.example.yaml

      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-caches
          path: |
            policy_discovered_events_cache.json
            policy_event_news_cache.json
          if-no-files-found: ignore

      - name: Commit discovery cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy_discovered_events_cache.json
          test ! -f policy_event_news_cache.json || git add -f policy_event_news_cache.json
          git diff --cached --quiet || git commit -m "Refresh event caches"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
